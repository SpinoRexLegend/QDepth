<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Bathymetry model R squared results</title>
  <desc id="desc">Two-panel bar chart separating full-split model results from QSVR subset results.</desc>
  <rect width="1120" height="620" fill="#071724"/>
  <text x="55" y="52" fill="#f5fbff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Model Performance Summary</text>
  <text x="55" y="80" fill="#9db5c5" font-family="Arial, sans-serif" font-size="15">R² is shown in separate panels because the evaluation sets differ.</text>

  <rect x="40" y="105" width="650" height="475" rx="18" fill="#0d2635" stroke="#21455a"/>
  <text x="66" y="142" fill="#eef8ff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Full split · 3,638 train / 910 test</text>
  <line x1="245" y1="165" x2="245" y2="545" stroke="#668093"/>
  <line x1="405" y1="165" x2="405" y2="545" stroke="#24495d"/>
  <line x1="565" y1="165" x2="565" y2="545" stroke="#24495d"/>
  <text x="240" y="565" text-anchor="middle" fill="#8eabba" font-family="Arial" font-size="12">0.0</text>
  <text x="405" y="565" text-anchor="middle" fill="#8eabba" font-family="Arial" font-size="12">0.25</text>
  <text x="565" y="565" text-anchor="middle" fill="#8eabba" font-family="Arial" font-size="12">0.50</text>

  <g font-family="Arial, sans-serif" font-size="14" fill="#dceaf2">
    <text x="225" y="193" text-anchor="end">MLP</text>
    <text x="225" y="238" text-anchor="end">XGBoost</text>
    <text x="225" y="283" text-anchor="end">VQR M3</text>
    <text x="225" y="328" text-anchor="end">SVR</text>
    <text x="225" y="373" text-anchor="end">Random Forest</text>
    <text x="225" y="418" text-anchor="end">Linear Regression</text>
    <text x="225" y="463" text-anchor="end">VQR M2</text>
    <text x="225" y="508" text-anchor="end">VQR M1</text>
  </g>
  <g>
    <rect x="245" y="177" width="310" height="22" rx="6" fill="#35d5b5"/><text x="565" y="193" fill="#dffdf7" font-family="Arial" font-size="13">0.4836</text>
    <rect x="245" y="222" width="301" height="22" rx="6" fill="#35d5b5"/><text x="556" y="238" fill="#dffdf7" font-family="Arial" font-size="13">0.4706</text>
    <rect x="245" y="267" width="296" height="22" rx="6" fill="#8c7cff"/><text x="551" y="283" fill="#ebe8ff" font-family="Arial" font-size="13">0.4631</text>
    <rect x="245" y="312" width="285" height="22" rx="6" fill="#35d5b5"/><text x="540" y="328" fill="#dffdf7" font-family="Arial" font-size="13">0.4453</text>
    <rect x="245" y="357" width="280" height="22" rx="6" fill="#35d5b5"/><text x="535" y="373" fill="#dffdf7" font-family="Arial" font-size="13">0.4375</text>
    <rect x="245" y="402" width="277" height="22" rx="6" fill="#35d5b5"/><text x="532" y="418" fill="#dffdf7" font-family="Arial" font-size="13">0.4334</text>
    <rect x="245" y="447" width="23" height="22" rx="6" fill="#8c7cff"/><text x="278" y="463" fill="#ebe8ff" font-family="Arial" font-size="13">0.0354</text>
    <rect x="245" y="492" width="132" height="22" rx="6" fill="#ff6f7d" transform="translate(0 0)"/><text x="387" y="508" fill="#ffdce0" font-family="Arial" font-size="13">−2.0711*</text>
  </g>
  <text x="66" y="546" fill="#7f9bad" font-family="Arial" font-size="11">*Negative R² bar is shown by magnitude for visibility.</text>

  <rect x="715" y="105" width="365" height="475" rx="18" fill="#0d2635" stroke="#21455a"/>
  <text x="742" y="142" fill="#eef8ff" font-family="Arial, sans-serif" font-size="20" font-weight="700">QSVR subset · 400 / 200</text>
  <text x="742" y="168" fill="#9db5c5" font-family="Arial" font-size="13">Depth-balanced, combined-region evaluation</text>
  <line x1="850" y1="205" x2="850" y2="430" stroke="#668093"/>
  <line x1="950" y1="205" x2="950" y2="430" stroke="#24495d"/>
  <line x1="1050" y1="205" x2="1050" y2="430" stroke="#24495d"/>
