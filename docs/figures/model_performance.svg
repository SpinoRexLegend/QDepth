  <rect x="850" y="295" width="183" height="26" rx="7" fill="#25c4f2"/><text x="1041" y="313" fill="#dcf8ff" font-family="Arial" font-size="13">0.5481</text>
  <rect x="850" y="360" width="117" height="26" rx="7" fill="#25c4f2"/><text x="975" y="378" fill="#dcf8ff" font-family="Arial" font-size="13">0.3524</text>
  <text x="850" y="450" text-anchor="middle" fill="#8eabba" font-family="Arial" font-size="12">0.0</text>
  <text x="950" y="450" text-anchor="middle" fill="#8eabba" font-family="Arial" font-size="12">0.3</text>
  <text x="1050" y="450" text-anchor="middle" fill="#8eabba" font-family="Arial" font-size="12">0.6</text>
  <rect x="742" y="486" width="14" height="14" rx="3" fill="#35d5b5"/><text x="764" y="498" fill="#9db5c5" font-family="Arial" font-size="12">Classical</text>
  <rect x="833" y="486" width="14" height="14" rx="3" fill="#8c7cff"/><text x="855" y="498" fill="#9db5c5" font-family="Arial" font-size="12">VQR</text>
  <rect x="902" y="486" width="14" height="14" rx="3" fill="#25c4f2"/><text x="924" y="498" fill="#9db5c5" font-family="Arial" font-size="12">QSVR</text>
  <text x="742" y="535" fill="#d3e5ef" font-family="Arial" font-size="13" font-weight="700">Do not merge the two rankings.</text>
  <text x="742" y="557" fill="#8eabba" font-family="Arial" font-size="12">They use different evaluation samples.</text>
</svg>

